<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>uuoxz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .enter-screen.hide {
            opacity: 0;
            visibility: hidden;
        }
        .enter-text {
            font-size: 24px;
            font-weight: 300;
            color: rgba(255,255,255,0.7);
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
            text-align: center;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.4; transform: scale(1); }
        }

        .falling-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }
        .star-fall {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            box-shadow: 0 0 2px white;
        }

        .profile {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            overflow-y: auto;
        }
        .profile.show {
            opacity: 1;
            visibility: visible;
        }

        .card {
            max-width: 380px;
            width: 100%;
            background: #000;
            border-radius: 32px;
            padding: 32px 24px;
            text-align: center;
            border: 1px solid #1a1a1a;
            box-shadow: none;
            animation: fadeInUp 0.6s ease;
            z-index: 3;
            position: relative;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 16px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #1a1a1a;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nickname {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
            text-align: center;
        }

        .status {
            font-size: 13px;
            color: #666;
            margin-bottom: 24px;
        }

        .music-player {
            background: #0a0a0a;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 28px;
            border: 1px solid #1a1a1a;
        }
        .player-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .track-cover {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            flex-shrink: 0;
        }
        .track-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .track-info-compact {
            flex: 1;
            text-align: left;
        }
        .track-name-compact {
            font-size: 13px;
            font-weight: 600;
            color: white;
        }
        .track-artist-compact {
            font-size: 10px;
            color: #666;
        }
        .player-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .compact-btn {
            width: 36px;
            height: 36px;
            background: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            color: white;
            transition: 0.1s;
        }
        .compact-btn:active {
            transform: scale(0.92);
            background: #1a1a1a;
        }
        .music-timer {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #444;
            font-family: monospace;
            margin-top: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 2px;
            background: #1a1a1a;
            border-radius: 2px;
            cursor: pointer;
            margin-top: 8px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #fff;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .social-title {
            color: #444;
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }
        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            color: white;
            transition: all 0.2s;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
        }
        .social-link i {
            font-size: 14px;
            color: white;
        }
        .social-link:active {
            transform: scale(0.94);
            background: #111;
        }

        @media (max-width: 450px) {
            .card { padding: 24px 20px; }
            .nickname { font-size: 28px; }
            .social-link { padding: 7px 14px; font-size: 12px; }
            .track-cover { width: 42px; height: 42px; }
            .compact-btn { width: 32px; height: 32px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="falling-stars" id="fallingStars"></div>

<div class="enter-screen" id="enterScreen">
    <div class="enter-text">CLICK TO ENTER...</div>
</div>

<div class="profile" id="profile">
    <div class="card">
        <div class="avatar">
            <img src="lol.jpg" alt="avatar" onerror="this.src='https://via.placeholder.com/96'">
        </div>

        <div class="nickname">uuoxz</div>
        <div class="status">coder</div>

        <div class="music-player">
            <div class="player-row">
                <div class="track-cover">
                    <img src="cover.jpg" alt="cover" onerror="this.src='https://via.placeholder.com/48?text=🎵'">
                </div>
                <div class="track-info-compact">
                    <div class="track-name-compact">sleep mode</div>
                    <div class="track-artist-compact">ONDA ANDAR</div>
                </div>
                <div class="player-buttons">
                    <div class="compact-btn" id="prevBtn">
                        <i class="fas fa-backward"></i>
                    </div>
                    <div class="compact-btn" id="playPauseBtn">
                        <i class="fas fa-play" id="playIcon"></i>
                    </div>
                    <div class="compact-btn" id="nextBtn">
                        <i class="fas fa-forward"></i>
                    </div>
                </div>
            </div>
            <div class="music-timer">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="social-title">СОЦСЕТИ</div>
        <div class="social-links">
            <a href="https://t.me/uuoxz" class="social-link" target="_blank"><i class="fab fa-telegram-plane"></i> Telegram</a>
            <a href="https://discord.gg/Qx8Ukb3G" class="social-link" target="_blank"><i class="fab fa-discord"></i> Discord</a>
            <a href="https://tiktok.com/@uuoxz" class="social-link" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
            <a href="https://github.com/uuoxz" class="social-link" target="_blank"><i class="fab fa-github"></i> GitHub</a>
        </div>
    </div>
</div>

<script>
    // Падающие звёзды
    function createFallingStars() {
        const container = document.getElementById('fallingStars');
        container.innerHTML = '';
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star-fall';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.animation = `fall ${Math.random() * 4 + 2}s linear infinite`;
            star.style.animationDelay = Math.random() * 8 + 's';
            container.appendChild(star);
        }
    }
    
    const style = document.createElement('style');
    style.textContent = `
        @keyframes fall {
            0% { transform: translateY(-10px); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
    `;
    document.head.appendChild(style);
    createFallingStars();

    // Enter screen
    const enterScreen = document.getElementById('enterScreen');
    const profile = document.getElementById('profile');
    enterScreen.addEventListener('click', () => {
        enterScreen.classList.add('hide');
        profile.classList.add('show');
        if (window.navigator?.vibrate) window.navigator.vibrate(30);
    });

    // Плеер
    let currentTrackIndex = 0;
    let isPlaying = false;
    
    const playlist = [
        { name: 'sleep mode', artist: 'ONDA ANDAR', file: 'ONDA%20ANDAR%20-%20sleep%20mode.mp3' }
    ];
    
    const audio = new Audio(playlist[0].file);
    audio.loop = true;
    
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const progressFill = document.getElementById('progressFill');
    const progressBarEl = document.getElementById('progressBar');

    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function updateProgress() {
        if (audio.duration && !isNaN(audio.duration)) {
            durationSpan.innerText = formatTime(audio.duration);
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeSpan.innerText = formatTime(audio.currentTime);
        }
    }

    audio.addEventListener('loadedmetadata', updateProgress);
    audio.addEventListener('timeupdate', updateProgress);

    function playTrack() {
        audio.play().then(() => {
            playIcon.className = 'fas fa-pause';
            isPlaying = true;
        }).catch(err => {
            console.log('Play error:', err);
        });
    }

    function pauseTrack() {
        audio.pause();
        playIcon.className = 'fas fa-play';
        isPlaying = false;
    }

    playPauseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isPlaying) {
            pauseTrack();
        } else {
            playTrack();
        }
    });

    progressBarEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!audio.duration) return;
        const rect = progressBarEl.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        audio.currentTime = percent * audio.duration;
        updateProgress();
    });
</script>
</body>
</html>
